services:
  nightcity-archive:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.mgxnet.com/nightcity-archive:latest
    container_name: nightcity-archive
    restart: unless-stopped
    ports:
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
